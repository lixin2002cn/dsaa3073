site_name: DSAA3073 - Theories in Data Science
site_description: Fall 2026 Course Materials
site_author: HKUST-GZ
site_url: https://lixin2002cn.github.io/dsaa3073/

theme:
  name: material
  favicon: assets/images/favicon.png
  icon:
    logo: material/book-open-page-variant
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - toc.follow
    - toc.integrate
    - content.code.copy

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: false
      toc_depth: 2
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - css/custom.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lixin2002cn/dsaa3073

nav:
  - Home: index.md
  - Materials:
      - Overview: materials/index.md
      - Lecture 1: materials/week1.md
      - Lecture 2: materials/week2.md
      - Lecture 3: materials/week3.md
      - Lecture 4: materials/week4.md
      - Lecture 5: materials/week5.md
      - Lecture 6: materials/week6.md
      - Lecture 7: materials/week7.md
      - Lecture 8: materials/week8.md
      - Lecture 9: materials/week9.md
      - Lecture 10: materials/week10.md
      - Lecture 11: materials/week11.md
      - Lecture 12: materials/week12.md
      - Lecture 13: materials/week13.md

# Retain previously published URLs outside the two main pages.
not_in_nav: |
  /schedule.md
  /assignment.md
  /logistics.md

copyright: Copyright &copy; 2026 HKUST-GZ
